# Minimal local single-master/single-worker Celeborn config for the resume-poc demo.
# Not tuned for anything but "runs on one laptop, one shuffle, tens of thousands of rows".

celeborn.metrics.enabled                 false
celeborn.master.endpoints                localhost:9097
celeborn.master.host                     localhost
celeborn.master.port                     9097

celeborn.worker.storage.dirs             __WORKER_DATA_DIR__
celeborn.worker.monitor.disk.enabled     false
celeborn.worker.flusher.buffer.size      256k

# Raised from the 300s default per LLD S6.5 -- generous for a demo that pauses between the two
# JVMs by hand; production would size this to the expected pod-reschedule budget instead.
celeborn.master.heartbeat.application.timeout   600s
